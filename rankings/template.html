<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBK Ranking — Espoon Biljardikerho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --felt:        #0e3b2a;   /* billiard cloth */
    --felt-dark:   #082017;
    --felt-light:  #1d5a44;
    --cream:       #f4ecd8;   /* aged paper */
    --cream-soft:  #e8dfc7;
    --ink:         #1a1410;
    --ink-soft:    #4a3f33;
    --chalk:       #2b4d8c;   /* cue chalk blue */
    --ball-red:    #b6322a;
    --ball-yellow: #d4a017;
    --rule:        rgba(26,20,16,0.18);
    --shadow:      0 1px 0 rgba(0,0,0,0.04), 0 12px 32px -8px rgba(14,59,42,0.18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--cream);
    background-image:
      radial-gradient(ellipse 100% 60% at 50% 0%, rgba(14,59,42,0.06), transparent 70%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.10 0 0 0 0 0.08 0 0 0 0 0.06 0 0 0 0.045 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    color: var(--ink);
    font-family: 'Fraunces', Georgia, serif;
    font-size: 17px;
    line-height: 1.55;
    min-height: 100vh;
  }

  /* ---------- HEADER ------------------------------------------- */

  header.masthead {
    background: var(--felt);
    color: var(--cream);
    padding: 40px 28px 48px;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--felt-dark);
  }
  header.masthead::before {
    /* subtle felt weave */
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,0.04) 0 2px, transparent 2px 5px);
    pointer-events: none;
  }
  header.masthead::after {
    /* corner pocket */
    content: "";
    position: absolute;
    top: -60px; right: -60px;
    width: 180px; height: 180px;
    background: radial-gradient(circle at 30% 30%, var(--felt-dark) 0 30%, transparent 65%);
    border-radius: 50%;
    opacity: 0.7;
  }

  .masthead-inner {
    max-width: 1100px; margin: 0 auto;
    position: relative; z-index: 1;
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 32px; flex-wrap: wrap;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: clamp(36px, 6vw, 64px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .brand em {
    font-style: italic;
    font-weight: 400;
    color: var(--ball-yellow);
  }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--cream-soft);
    opacity: 0.8;
    margin-bottom: 14px;
  }
  .source-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--cream-soft);
    text-decoration: none;
    border-bottom: 1px dotted rgba(244,236,216,0.4);
    padding-bottom: 2px;
  }
  .source-link:hover { color: var(--ball-yellow); border-bottom-color: var(--ball-yellow); }

  /* ---------- NAV / VIEW SWITCHER ----------------------------- */

  nav.views {
    background: var(--felt-dark);
    padding: 0 28px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 8px 24px -8px rgba(0,0,0,0.25);
  }
  .views-inner {
    max-width: 1100px; margin: 0 auto;
    display: flex; gap: 0;
  }
  .views button {
    background: none;
    border: none;
    color: var(--cream-soft);
    padding: 18px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    cursor: pointer;
    position: relative;
    transition: color 0.15s;
  }
  .views button:hover { color: var(--cream); }
  .views button.active { color: var(--ball-yellow); }
  .views button.active::after {
    content: "";
    position: absolute;
    left: 22px; right: 22px; bottom: 0;
    height: 2px; background: var(--ball-yellow);
  }

  /* ---------- MAIN -------------------------------------------- */

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 28px 80px;
  }

  .view { display: none; }
  .view.active { display: block; animation: fade 0.3s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- CONTROLS ---------------------------------------- */

  .controls {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    margin-bottom: 32px;
    padding: 18px 22px;
    background: var(--cream-soft);
    border: 1px solid var(--rule);
    border-radius: 2px;
    box-shadow: var(--shadow);
  }
  .control-group {
    display: flex; align-items: baseline; gap: 10px;
  }
  .control-group label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
  }
  .control-group select, .control-group input {
    background: var(--cream);
    border: 1px solid var(--rule);
    padding: 8px 12px;
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--ink);
    border-radius: 1px;
    min-width: 140px;
  }
  .control-group select:focus, .control-group input:focus {
    outline: 2px solid var(--felt);
    outline-offset: 1px;
  }

  /* ---------- SECTION HEAD ------------------------------------ */

  .section-head {
    display: flex; align-items: baseline;
    gap: 16px; margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--ink);
  }
  .section-head h2 {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: clamp(28px, 4vw, 42px);
    line-height: 1; margin: 0;
    letter-spacing: -0.015em;
  }
  .section-head .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-left: auto;
  }
  .live-dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--ball-red);
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 0 0 rgba(182,50,42,0.6);
    animation: pulse 1.8s infinite;
    vertical-align: 1px;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(182,50,42,0.5); }
    70%  { box-shadow: 0 0 0 9px rgba(182,50,42,0); }
    100% { box-shadow: 0 0 0 0 rgba(182,50,42,0); }
  }

  /* ---------- TABLE ------------------------------------------- */

  .ranking-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--cream-soft);
    box-shadow: var(--shadow);
    font-family: 'Fraunces', serif;
  }
  .ranking-table th {
    text-align: left;
    padding: 14px 18px;
    background: var(--felt);
    color: var(--cream);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 500;
    border-bottom: 1px solid var(--felt-dark);
  }
  .ranking-table th.num { text-align: right; }
  .ranking-table td {
    padding: 12px 18px;
    border-bottom: 1px solid var(--rule);
    vertical-align: baseline;
  }
  .ranking-table td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .ranking-table tbody tr {
    transition: background 0.1s;
    cursor: pointer;
  }
  .ranking-table tbody tr:hover { background: rgba(14,59,42,0.06); }
  .ranking-table .rank {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 22px;
    width: 60px;
    color: var(--ink);
    line-height: 1;
  }
  .ranking-table tr:nth-child(1) .rank { color: var(--ball-yellow); -webkit-text-stroke: 0.5px var(--ink); }
  .ranking-table tr:nth-child(2) .rank { color: #9a9a9a; -webkit-text-stroke: 0.5px var(--ink); }
  .ranking-table tr:nth-child(3) .rank { color: #b08246; -webkit-text-stroke: 0.5px var(--ink); }
  .ranking-table .player-name {
    font-weight: 600;
    font-size: 17px;
  }
  .ranking-table .player-name small {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    margin-top: 2px;
    text-transform: uppercase;
  }

  /* ---------- HISTORY: archive index -------------------------- */

  .archive-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .archive-card {
    background: var(--cream-soft);
    border: 1px solid var(--rule);
    padding: 16px 18px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    border-radius: 1px;
  }
  .archive-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: var(--felt);
  }
  .archive-card .year {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 26px;
    line-height: 1;
    color: var(--felt);
  }
  .archive-card .disc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  /* ---------- PLAYER PROFILE ---------------------------------- */

  .profile-head {
    background: var(--felt);
    color: var(--cream);
    padding: 32px 36px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .profile-head::before {
    content: "";
    position: absolute;
    right: -40px; bottom: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, var(--ball-red) 0 25%, transparent 28%);
    opacity: 0.25;
  }
  .profile-head .player-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--ball-yellow);
    margin-bottom: 8px;
  }
  .profile-head h2 {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-style: italic;
    font-size: clamp(36px, 5vw, 56px);
    line-height: 0.95;
    margin: 0;
    letter-spacing: -0.015em;
  }
  .profile-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 24px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(244,236,216,0.2);
  }
  .stat-num {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 32px;
    line-height: 1;
    color: var(--ball-yellow);
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--cream-soft);
    margin-top: 6px;
  }

  .chart-block { margin: 28px 0; }
  .chart-block h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  svg.chart { width: 100%; height: 200px; display: block; }
  svg.chart .axis { stroke: var(--rule); stroke-width: 1; }
  svg.chart .grid { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 3; }
  svg.chart .axis-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    fill: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  svg.chart .line { fill: none; stroke-width: 2; }
  svg.chart .dot { stroke: var(--cream); stroke-width: 2; }

  /* legend */
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; }
  .legend span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-soft);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .legend span::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    background: var(--swatch, var(--ink));
  }

  /* empty state */
  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-style: italic;
    border: 1px dashed var(--rule);
    background: rgba(14,59,42,0.02);
  }

  /* source image fallback */
  .source-image-block {
    margin-top: 30px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
  }
  .source-image-block .caption {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .source-image-block a { color: var(--chalk); }

  footer {
    border-top: 1px solid var(--rule);
    padding: 28px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }

  /* mobile */
  @media (max-width: 640px) {
    .views-inner { overflow-x: auto; }
    .views button { padding: 16px 14px; font-size: 11px; letter-spacing: 0.12em; flex-shrink: 0; }
    main { padding: 24px 16px 60px; }
    .ranking-table th, .ranking-table td { padding: 10px 12px; }
    .ranking-table .rank { font-size: 18px; width: 40px; }
    .section-head { flex-wrap: wrap; }
    .section-head .meta { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div>
      <div class="kicker">Espoon Biljardikerho · est. 1980</div>
      <h1 class="brand">EBK <em>Ranking</em></h1>
    </div>
    <a class="source-link" href="https://www.espoonbiljardikerho.com/tulospalvelu/ranking/" target="_blank" rel="noopener">
      espoonbiljardikerho.com/ranking ↗
    </a>
  </div>
</header>

<nav class="views">
  <div class="views-inner">
    <button data-view="current" class="active">Current Standings</button>
    <button data-view="history">Archive</button>
    <button data-view="player">Player Profile</button>
  </div>
</nav>

<main>

  <!-- ========== CURRENT STANDINGS ========== -->
  <section class="view active" id="view-current">
    <div class="controls">
      <div class="control-group">
        <label for="cur-discipline">Discipline</label>
        <select id="cur-discipline"></select>
      </div>
    </div>
    <div id="current-content"></div>
  </section>

  <!-- ========== HISTORY ========== -->
  <section class="view" id="view-history">
    <div class="controls">
      <div class="control-group">
        <label for="hist-year">Year</label>
        <select id="hist-year"></select>
      </div>
      <div class="control-group">
        <label for="hist-discipline">Discipline</label>
        <select id="hist-discipline"></select>
      </div>
    </div>
    <div id="history-content"></div>
  </section>

  <!-- ========== PLAYER PROFILE ========== -->
  <section class="view" id="view-player">
    <div class="controls">
      <div class="control-group">
        <label for="player-search">Player</label>
        <select id="player-search"></select>
      </div>
    </div>
    <div id="player-content"></div>
  </section>

</main>

<footer>
  Sample data — schema demonstration · built on SQLite · source: espoonbiljardikerho.com
</footer>

<script>
  // ============================================================
  // DATA  (inlined at build time from rankings.json)
  // ============================================================
  const DATA = /*__DATA__*/null;

  // Discipline display metadata.
  const DISCIPLINES = {
    ebk:     { label: "EBK Overall",  color: "#0e3b2a", order: 0 },
    kaisa:   { label: "Kaisa",        color: "#b6322a", order: 1 },
    pool:    { label: "Pool",         color: "#2b4d8c", order: 2 },
    kara:    { label: "Kara",         color: "#d4a017", order: 3 },
    pyramid: { label: "Pyramid",      color: "#5a3a7a", order: 4 },
    snooker: { label: "Snooker",      color: "#2d6b3f", order: 5 },
  };

  // Quick lookups.
  const PLAYERS_BY_ID = Object.fromEntries(DATA.players.map(p => [p.id, p]));
  const PLAYERS_BY_SLUG = Object.fromEntries(DATA.players.map(p => [p.slug, p]));
  const COMP_BY_ID = Object.fromEntries(DATA.competitions.map(c => [c.id, c]));
  const RESULTS_BY_COMP = {};
  const RESULTS_BY_PLAYER = {};
  for (const r of DATA.results) {
    (RESULTS_BY_COMP[r.competition_id] ??= []).push(r);
    (RESULTS_BY_PLAYER[r.player_id]   ??= []).push(r);
  }

  const YEARS = [...new Set(DATA.competitions.map(c => c.year))].sort((a,b) => b-a);
  const CURRENT_YEAR = Math.max(...YEARS);

  // ============================================================
  // RENDER HELPERS
  // ============================================================
  function fmtPoints(n) {
    if (n == null) return "—";
    return Number.isInteger(n) ? n.toString() : n.toFixed(1);
  }

  function findCompetition(year, kind) {
    return DATA.competitions.find(c => c.year === year && c.kind === kind);
  }

  function rankingTable(comp, opts={}) {
    const rows = (RESULTS_BY_COMP[comp.id] || []).slice().sort((a,b) => a.rank - b.rank);
    if (!rows.length) return `<div class="empty">No data for this competition.</div>`;

    const showEvents = opts.showEvents ?? (comp.kind !== "ebk");
    const tr = rows.map(r => {
      const p = PLAYERS_BY_ID[r.player_id];
      const events = r.events_played != null
        ? `<small>${r.events_played} events played</small>` : "";
      return `<tr data-slug="${p.slug}">
        <td class="num rank">${r.rank}</td>
        <td><div class="player-name">${p.name}${events}</div></td>
        <td class="num">${fmtPoints(r.total_points)}</td>
      </tr>`;
    }).join("");

    return `
      <table class="ranking-table">
        <thead><tr>
          <th class="num">#</th>
          <th>Player</th>
          <th class="num">Points</th>
        </tr></thead>
        <tbody>${tr}</tbody>
      </table>
      ${comp.source_image ? `
        <div class="source-image-block">
          <div class="caption">Original published ranking sheet</div>
          <a href="${comp.source_image}" target="_blank" rel="noopener">${comp.source_image}</a>
        </div>` : ""}
    `;
  }

  // ============================================================
  // VIEW 1 — CURRENT STANDINGS
  // ============================================================
  function initCurrent() {
    const sel = document.getElementById("cur-discipline");
    const kinds = Object.entries(DISCIPLINES)
      .filter(([k]) => DATA.competitions.some(c => c.year === CURRENT_YEAR && c.kind === k))
      .sort((a,b) => a[1].order - b[1].order);
    sel.innerHTML = kinds.map(([k, m]) =>
      `<option value="${k}">${m.label}</option>`).join("");
    sel.addEventListener("change", renderCurrent);
    renderCurrent();
  }

  function renderCurrent() {
    const kind = document.getElementById("cur-discipline").value;
    const comp = findCompetition(CURRENT_YEAR, kind);
    const meta = DISCIPLINES[kind];
    document.getElementById("current-content").innerHTML = `
      <div class="section-head">
        <h2>${meta.label} ${CURRENT_YEAR}</h2>
        <div class="meta"><span class="live-dot"></span>Live · ${RESULTS_BY_COMP[comp.id]?.length || 0} players</div>
      </div>
      ${rankingTable(comp)}
    `;
    attachPlayerClicks("current-content");
  }

  // ============================================================
  // VIEW 2 — HISTORY / ARCHIVE
  // ============================================================
  function initHistory() {
    const yearSel = document.getElementById("hist-year");
    yearSel.innerHTML = YEARS.map(y =>
      `<option value="${y}"${y===CURRENT_YEAR-1?" selected":""}>${y}</option>`).join("");

    const discSel = document.getElementById("hist-discipline");
    discSel.innerHTML = Object.entries(DISCIPLINES)
      .sort((a,b) => a[1].order - b[1].order)
      .map(([k, m]) => `<option value="${k}">${m.label}</option>`).join("");

    yearSel.addEventListener("change", renderHistory);
    discSel.addEventListener("change", renderHistory);
    renderHistory();
  }

  function renderHistory() {
    const year = +document.getElementById("hist-year").value;
    const kind = document.getElementById("hist-discipline").value;
    const meta = DISCIPLINES[kind];
    const comp = findCompetition(year, kind);
    const content = document.getElementById("history-content");

    if (!comp) {
      content.innerHTML = `
        <div class="section-head">
          <h2>${meta.label} ${year}</h2>
          <div class="meta">No data</div>
        </div>
        <div class="empty">
          No structured data for ${meta.label} ${year} yet.<br>
          The original JPEG may still be on the EBK archive page.
        </div>`;
      return;
    }

    content.innerHTML = `
      <div class="section-head">
        <h2>${meta.label} ${year}</h2>
        <div class="meta">${RESULTS_BY_COMP[comp.id]?.length || 0} players · archived</div>
      </div>
      ${rankingTable(comp)}
    `;
    attachPlayerClicks("history-content");
  }

  // ============================================================
  // VIEW 3 — PLAYER PROFILE
  // ============================================================
  function initPlayer() {
    const sel = document.getElementById("player-search");
    sel.innerHTML = DATA.players.map(p =>
      `<option value="${p.slug}">${p.name}</option>`).join("");
    sel.addEventListener("change", renderPlayer);
    renderPlayer();
  }

  function renderPlayer(slug) {
    const sel = document.getElementById("player-search");
    if (slug && PLAYERS_BY_SLUG[slug]) sel.value = slug;
    const player = PLAYERS_BY_SLUG[sel.value];
    if (!player) return;

    const myResults = RESULTS_BY_PLAYER[player.id] || [];
    const seasons = myResults.map(r => {
      const c = COMP_BY_ID[r.competition_id];
      return { ...r, year: c.year, kind: c.kind, comp_title: c.title };
    });

    // Aggregate stats.
    const bestRank = Math.min(...seasons.map(s => s.rank));
    const podiums  = seasons.filter(s => s.rank <= 3).length;
    const seasonsCount = new Set(seasons.map(s => s.year)).size;
    const titles = seasons.filter(s => s.rank === 1).length;

    // Build per-discipline series for the line chart.
    const byKind = {};
    for (const s of seasons) {
      if (s.kind === "ebk") continue; // chart per-discipline
      (byKind[s.kind] ??= []).push({ year: s.year, rank: s.rank });
    }
    for (const k in byKind) byKind[k].sort((a,b) => a.year - b.year);

    document.getElementById("player-content").innerHTML = `
      <div class="profile-head">
        <div class="player-label">Player profile</div>
        <h2>${player.name}</h2>
        <div class="profile-stats">
          <div><div class="stat-num">${seasonsCount}</div><div class="stat-label">Seasons</div></div>
          <div><div class="stat-num">#${isFinite(bestRank) ? bestRank : "—"}</div><div class="stat-label">Best Finish</div></div>
          <div><div class="stat-num">${podiums}</div><div class="stat-label">Top-3 Results</div></div>
          <div><div class="stat-num">${titles}</div><div class="stat-label">Titles</div></div>
        </div>
      </div>

      <div class="chart-block">
        <h3>Finishing position by year (lower is better)</h3>
        <div class="legend">${Object.keys(byKind).sort().map(k =>
          `<span style="--swatch:${DISCIPLINES[k].color}">${DISCIPLINES[k].label}</span>`).join("")}</div>
        ${renderRankChart(byKind)}
      </div>

      <div class="section-head"><h2>All seasons</h2><div class="meta">${seasons.length} entries</div></div>
      ${renderSeasonsTable(seasons)}
    `;
  }

  function renderRankChart(byKind) {
    if (!Object.keys(byKind).length) return `<div class="empty">No discipline data.</div>`;
    const W = 800, H = 200, P = { l: 36, r: 12, t: 12, b: 28 };
    const allYears = [...new Set(Object.values(byKind).flat().map(d => d.year))].sort();
    const maxRank = Math.max(...Object.values(byKind).flat().map(d => d.rank));
    const minYear = Math.min(...allYears), maxYear = Math.max(...allYears);

    const x = y => P.l + (allYears.length <= 1 ? (W - P.l - P.r) / 2
      : ((y - minYear) / (maxYear - minYear)) * (W - P.l - P.r));
    const yScale = r => P.t + ((r - 1) / (maxRank - 1 || 1)) * (H - P.t - P.b);

    // Grid lines at rank 1, mid, max.
    const gridRanks = [1, Math.round(maxRank/2), maxRank];
    const grid = gridRanks.map(r =>
      `<line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${yScale(r)}" y2="${yScale(r)}"/>
       <text class="axis-label" x="${P.l-6}" y="${yScale(r)+3}" text-anchor="end">#${r}</text>`).join("");

    const xTicks = allYears.map(y =>
      `<text class="axis-label" x="${x(y)}" y="${H-8}" text-anchor="middle">${y}</text>`).join("");

    const series = Object.entries(byKind).map(([kind, pts]) => {
      const color = DISCIPLINES[kind].color;
      const d = pts.map((p,i) => `${i===0?"M":"L"}${x(p.year)},${yScale(p.rank)}`).join("");
      const dots = pts.map(p =>
        `<circle class="dot" cx="${x(p.year)}" cy="${yScale(p.rank)}" r="4" fill="${color}"/>`).join("");
      return `<path class="line" stroke="${color}" d="${d}"/>${dots}`;
    }).join("");

    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${grid}${xTicks}${series}
    </svg>`;
  }

  function renderSeasonsTable(seasons) {
    if (!seasons.length) return `<div class="empty">No results for this player.</div>`;
    seasons = seasons.slice().sort((a,b) => b.year - a.year ||
      DISCIPLINES[a.kind].order - DISCIPLINES[b.kind].order);
    const tr = seasons.map(s => {
      const meta = DISCIPLINES[s.kind];
      return `<tr>
        <td class="num">${s.year}</td>
        <td><strong style="color:${meta.color}">●</strong> ${meta.label}</td>
        <td class="num rank" style="font-size:18px">${s.rank}</td>
        <td class="num">${fmtPoints(s.total_points)}</td>
        <td class="num">${s.events_played ?? "—"}</td>
      </tr>`;
    }).join("");
    return `
      <table class="ranking-table">
        <thead><tr>
          <th class="num">Year</th>
          <th>Competition</th>
          <th class="num">Rank</th>
          <th class="num">Points</th>
          <th class="num">Events</th>
        </tr></thead>
        <tbody>${tr}</tbody>
      </table>`;
  }

  // ============================================================
  // INTERACTIONS
  // ============================================================
  function attachPlayerClicks(containerId) {
    document.querySelectorAll(`#${containerId} tr[data-slug]`).forEach(tr => {
      tr.addEventListener("click", () => {
        document.querySelector('button[data-view="player"]').click();
        renderPlayer(tr.dataset.slug);
      });
    });
  }

  document.querySelectorAll(".views button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".views button").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("view-" + btn.dataset.view).classList.add("active");
    });
  });

  // Boot.
  initCurrent();
  initHistory();
  initPlayer();
</script>

</body>
</html>
